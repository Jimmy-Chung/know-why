function answer(n){

let pileObserver;
function makePile(trail){
  if(pileObserver)pileObserver.disconnect();
  const container=$('#kk-stack');
  const current=container.querySelector('.kk-dialog');
  current.classList.add('kk-foreground');
  current.style.setProperty('--kk-rotation','0deg');
  current.style.zIndex=String(trail.length);
  const stage=document.createElement('div');stage.className='kk-pile-stage';
  const plane=document.createElement('div');plane.className='kk-pile-plane';
  trail.slice(0,-1).forEach((n,i)=>{
    const distance=trail.length-1-i,ghost=document.createElement('article');
    ghost.className='kk-dialog kk-ghost';ghost.setAttribute('aria-hidden','true');ghost.setAttribute('inert','');
    ghost.style.setProperty('--kk-rotation',-distance*design.rotation+'deg');
    ghost.style.setProperty('--kk-layer-blur',Math.min(distance*design.blur,5)+'px');
    ghost.style.setProperty('--kk-layer-opacity',Math.max(.48,1-distance*.13));
    ghost.style.zIndex=String(i);
    ghost.innerHTML='<div class="kk-dialog-top"><span>'+icon(n.parent?'git-branch':'message-circle')+esc(n.title)+'</span></div><div class="kk-messages"><div class="kk-user">'+esc(n.question)+'</div><div class="kk-answer-label"><span>'+icon('sparkles')+'</span>'+esc(providers[session.provider].name)+'</div><div class="kk-answer">'+answer(n)+'</div></div><div class="kk-composer"><div class="kk-ghost-draft"></div><div class="kk-ghost-draft"></div></div>';
    plane.appendChild(ghost);
  });
  plane.appendChild(current);stage.appendChild(plane);container.replaceChildren(stage);
  function fitPile(){
    const available=container.clientWidth;
    if(!available)return;
    const cardWidth=Math.max(260,available-(trail.length>1?48:0));
    if(plane.style.width!==cardWidth+'px')plane.style.width=cardWidth+'px';
    const h=current.offsetHeight,cx=cardWidth/2,cy=h/2;
    let minX=0,maxX=cardWidth,minY=0,maxY=h;
    trail.forEach((n,i)=>{
      const a=-(trail.length-1-i)*design.rotation*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
      [[0,0],[cardWidth,0],[cardWidth,h],[0,h]].forEach(([x,y])=>{
        const rx=cx+(x-cx)*c-(y-cy)*s,ry=cy+(x-cx)*s+(y-cy)*c;
        minX=Math.min(minX,rx);maxX=Math.max(maxX,rx);minY=Math.min(minY,ry);maxY=Math.max(maxY,ry);
      });
    });
    const scale=Math.min(1,(available-(trail.length>1?24:0))/(maxX-minX));
    const padding=trail.length>1?26:4;
    plane.style.transform='scale('+scale+')';
    plane.style.left=((available-(maxX-minX)*scale)/2-minX*scale)+'px';
    plane.style.top=(padding-minY*scale)+'px';
    stage.style.height=((maxY-minY)*scale+padding*2)+'px';
    if(selectedTerm&&$('#kk-selection')?.children.length)requestAnimationFrame(()=>{if(selectedTerm)showSelection(selectedTerm)});
  }

  pileObserver=new ResizeObserver(fitPile);pileObserver.observe(container);pileObserver.observe(current);

function drawTree(){

  function place(n,depth){

    const kids=children.get(n.id)||[];

    layout.set(n.id,{lane,depth});return lane;
  }
  session.nodes.filter(n=>!n.parent).forEach(n=>place(n,0));
  const height=Math.max(320,maxDepth*116+88),usable=Math.max(0,width-48),activePath=new Set(path(node()).map(n=>n.id));
  layout.forEach(p=>{p.x=leafCount>1?24+p.lane*usable/(leafCount-1):width/2;p.y=maxDepth?height-44-p.depth*(height-88)/maxDepth:height/2});
  container.style.height=height+'px';
  const edges=session.nodes.filter(n=>n.parent).map(n=>{
    const a=layout.get(n.parent),b=layout.get(n.id),middle=(a.y+b.y)/2;
    return '<path class="'+(activePath.has(n.id)?'on-path':'')+'" d="M '+a.x+' '+a.y+' C '+a.x+' '+middle+', '+b.x+' '+middle+', '+b.x+' '+b.y+'"/>';
  }).join('');
  container.innerHTML='<svg class="kk-branch-lines" width="'+width+'" height="'+height+'" aria-hidden="true">'+edges+'</svg>'+session.nodes.map(n=>{
    const p=layout.get(n.id),active=n.id===session.active;
    const label=n.title+(active?' · 当前卡片':!n.parent?' · 主会话':' · 知识分支');
    return '<button type="button" class="kk-graph-node '+(active?'active ':'')+(activePath.has(n.id)?'on-path ':'')+(!n.parent?'is-root':'')+'" style="left:'+p.x+'px;top:'+p.y+'px" data-node="'+n.id+'" aria-label="'+esc(label)+'" '+(active?'aria-current="true"':'')+' data-tooltip="'+esc(label)+'" data-tooltip-placement="left"><span class="kk-graph-dot" aria-hidden="true"></span></button>';
  }).join('');
}
function showSelection(t,selectionRect){
  selectedTerm=t;
  const el=$('#kk-selection'),card=$('.kk-foreground'),answerEl=card?.querySelector('[data-answer]');
  if(!el||!card||!answerEl)return;
  if(el.parentElement!==card)card.appendChild(el);
  el.innerHTML='<div class="kk-selection-actions" role="group" aria-label="选中文字操作"><button type="button" data-action="quote" aria-label="引用到当前卡片" data-tooltip="引用到当前卡片">'+icon('quote')+'</button><span class="kk-action-divider" aria-hidden="true"></span><button type="button" data-action="explore" aria-label="探索新分支" data-tooltip="探索新分支">'+icon('git-branch')+'</button></div>';
  if(!selectionRect){
    const walker=document.createTreeWalker(answerEl,NodeFilter.SHOW_TEXT);let textNode;
    while(textNode=walker.nextNode()){const index=textNode.textContent.indexOf(t);if(index>=0){const range=document.createRange();range.setStart(textNode,index);range.setEnd(textNode,index+t.length);selectionRect=range.getBoundingClientRect();break}}
  }
  const box=card.getBoundingClientRect(),scale=box.width/card.offsetWidth;
  const anchor=selectionRect||answerEl.getBoundingClientRect();
  const localX=(anchor.left-box.left)/scale,localY=(anchor.top-box.top)/scale;
  el.style.left=Math.max(9,Math.min(localX,card.offsetWidth-el.offsetWidth-9))+'px';
  el.style.top=(localY>90?localY-el.offsetHeight-7:(anchor.bottom-box.top)/scale+7)+'px';
  icons();
}
function hideSelection(){selectedTerm='';const el=$('#kk-selection');if(el)el.replaceChildren();window.getSelection()?.removeAllRanges()}
function quoteSelection(){
  if(!selectedTerm)return;
  node().quote={text:selectedTerm,sourceCardId:node().id};
  hideSelection();render();
  $('.kk-foreground textarea')?.focus();
  announce('已引用到当前卡片。输入问题后发送即可；不会创建分支。');
}
function quotedDraft(){const q=node().quote;return q?'<div class="kk-draft-quote">'+icon('quote')+'<div><small>引用当前卡片</small>'+esc(q.text)+'</div><button type="button" data-action="remove-quote" aria-label="移除引用">'+icon('x')+'</button></div>':''}
function captureSelection(){
  const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return;
  const range=selection.getRangeAt(0),answerEl=$('.kk-foreground [data-answer]');
  if(!answerEl||!answerEl.contains(range.startContainer)||!answerEl.contains(range.endContainer))return;
  const text=selection.toString().trim();if(text)showSelection(text,range.getBoundingClientRect());
}
function go(id){session.active=id;selectedTerm='';render(true);announce('已切换到「'+node().title+'」，保留该卡片的对话与草稿。')}
function explore(){const title=(selectedTerm||'新的知识').replace(/[《》]/g,'');let t=session.nodes.find(n=>n.parent===node().id&&n.title===title);if(!t){t={id:'node'+seq++,parent:node().id,title,question:'请结合刚才的上下文，解释「'+title+'」。',kind:(nodes().find(x=>x.title===title)||{kind:'custom'}).kind,extra:[],draft:''};session.nodes.push(t)}currentScene='deep';go(t.id);announce('已展开「'+title+'」分支，并继承分叉前的上下文。')}
function newSession(){const s={id:'s'+seq++,title:'新的探索',provider:defaultProvider,locked:false,nodes:[{id:'main',parent:null,title:'主会话',question:'',kind:'custom',extra:[],draft:''}],active:'main',web:'auto',think:'deep',assistant:[],assistantDraft:''};sessions.unshift(s);session=s;assistantOpen=false;selectedTerm='';currentScene='new';$('#kk-modal').hidden=true;render(true)}
function renderAssistant(){const panel=$('#kk-assistant');panel.hidden=!assistantOpen;if(!assistantOpen)return;panel.innerHTML='<div class="kk-assistant-header"><div><h2>'+icon('sparkles')+' 会话知识助手</h2><p>'+esc(providers[session.provider].model)+' · 与会话一致</p></div><button data-action="close-assistant" aria-label="关闭会话知识助手">'+icon('x')+'</button></div><div class="kk-assistant-scope">本会话 · '+session.nodes.length+' 张卡片 · 可追溯到原始消息</div><div class="kk-assistant-body">'+(session.assistant.length?session.assistant.map(m=>'<div class="kk-user">'+esc(m)+'</div><p>在这次探索里，我们讨论了动画电影的表达，以及它与技术、城市和个体处境的关系。</p><p>你可以回到这些卡片继续阅读：</p>'+session.nodes.filter(n=>n.parent).slice(0,2).map(n=>'<button class="kk-citation" data-source="'+n.id+'"><div>'+esc(n.title)+'<span>'+esc(path(n).map(p=>p.title).join(' › '))+'</span></div>'+icon('arrow-up-right')+'</button>').join('')).join(''):'<div class="kk-answer-label">'+icon('sparkles')+' 把散开的思路，重新连起来。</div><p>我会从当前会话的所有分支中查找内容，帮你回顾、比较和整理。</p><button class="kk-citation" data-ask="我们刚才探索过哪些概念？">我们刚才探索过哪些概念？'+icon('arrow-up-right')+'</button>')+'</div>'+composer(true);icons()}
function showProviders(){editProvider=session.provider;$('#kk-modal').hidden=false;renderProviders()}
function renderProviders(){const p=providers[editProvider];$('#kk-modal').innerHTML='<section class="kk-settings" role="dialog" aria-modal="true" aria-label="Provider 设置"><div class="kk-settings-header"><h2>模型服务</h2><button data-action="close-modal" aria-label="关闭设置">'+icon('x')+'</button></div><p>配置你的 Provider，为新的探索选择一个默认起点。</p><div class="kk-settings-list">'+providers.map((p,i)=>'<button data-edit-provider="'+i+'" class="'+(i===editProvider?'selected':'')+'"><span class="kk-provider-mark">'+p.mark+'</span>'+esc(p.name)+(i===defaultProvider?'<small>默认</small>':'')+'</button>').join('')+'<button data-action="add-provider">'+icon('plus')+' 兼容接口</button></div><label class="kk-field">配置名称<input id="kk-config-name" value="'+esc(p.name)+'"></label><label class="kk-field">API 地址<input id="kk-config-address" value="'+esc(p.address)+'"></label><div class="kk-field-row"><label class="kk-field">API Key<input id="kk-config-key" type="password" autocomplete="off" placeholder="仅演示，请勿填入真实密钥"></label><label class="kk-field">默认模型<input id="kk-config-model" value="'+esc(p.model)+'"></label></div><label class="kk-default"><input id="kk-config-default" type="checkbox" '+(defaultProvider===editProvider?'checked':'')+'> 设为新会话的默认 Provider</label><div class="kk-settings-actions"><button data-action="test-provider">'+icon('plug')+' 测试连接</button><button class="kk-save" data-action="save-provider">保存设置</button></div><div class="kk-settings-note" id="kk-settings-note">修改默认项只影响新会话。这里是配置交互演示。</div></section>';icons()}
function scene(s){currentScene=s;assistantOpen=false;$('#kk-modal').hidden=true;if(s==='new'){newSession();return}session=sessions.find(s=>s.id==='demo')||sessions[0];if(!session.locked){session.locked=true;session.nodes=nodes();session.title='日本电影与叙事'}if(s==='deep'||s==='assistant')session.nodes=nodes();session.active=s==='deep'?'cyber':'main';selectedTerm=s==='explore'?'阿基拉':'';if(s==='assistant'){assistantOpen=true;session.active='cyber';if(!session.assistant.length)session.assistant.push('我们聊到的赛博朋克，和《阿基拉》有什么关系？')}render(true);if(s==='providers')showProviders()}
function stopPlay(){playing=false;timers.forEach(clearTimeout);timers=[];$('#kk-play').innerHTML=icon('play')+' 播放探索过程';icons()}
function play(){if(playing){stopPlay();return}playing=true;$('#kk-play').innerHTML=icon('pause')+' 停止演示';session=sessions.find(s=>s.id==='demo')||sessions[0];session.nodes=nodes().slice(0,1);scene('explore');timers.push(setTimeout(()=>{selectedTerm='阿基拉';explore();announce('探索《阿基拉》：主会话留在下层。')},2000),setTimeout(()=>{showSelection('赛博朋克');announce('选中新的概念，还可以继续深入。')},4000),setTimeout(()=>{selectedTerm='赛博朋克';explore();announce('第二层分支已展开，右侧路径同步高亮。')},5700),setTimeout(()=>{go('main');announce('点击树节点，直接返回主会话。')},8000),setTimeout(()=>{scene('assistant');announce('知识助手跨分支回答，并提供来源入口。')},10000),setTimeout(stopPlay,12000));icons()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.scene){stopPlay();scene(b.dataset.scene);return}if(b.dataset.node){go(b.dataset.node);return}if(b.dataset.source){assistantOpen=false;go(b.dataset.source);$('.kk-foreground').classList.add('kk-highlight');announce('已定位来源卡片中的示例回答。');return}if(b.dataset.session){session=sessions.find(s=>s.id===b.dataset.session);assistantOpen=false;selectedTerm='';render();return}if(b.dataset.delete){const i=sessions.findIndex(s=>s.id===b.dataset.delete);sessions.splice(i,1);if(!sessions.length)newSession();else{if(session.id===b.dataset.delete)session=sessions[0];render()}announce('已删除演示会话。');return}if(b.dataset.term){const picked=window.getSelection()?.toString().trim();if(picked){captureSelection();return}const existing=session.nodes.find(n=>n.title===b.dataset.term.replace(/[《》]/g,''));if(existing&&existing.id!==node().id)go(existing.id);else showSelection(b.dataset.term);return}if(b.dataset.suggest){node().draft=b.dataset.suggest;render();$('textarea').focus();return}if(b.dataset.ask){session.assistant.push(b.dataset.ask);renderAssistant();return}if(b.dataset.provider!==undefined){editProvider=Number(b.dataset.provider);$('#kk-modal').hidden=false;renderProviders();return}if(b.dataset.editProvider!==undefined){editProvider=Number(b.dataset.editProvider);renderProviders();return}
switch(b.dataset.action){case'send':sendMessage(b.closest('form'));break;case'new':newSession();break;case'explore':explore();window.getSelection()?.removeAllRanges();break;case'quote':quoteSelection();break;case'remove-quote':node().quote=null;render();$('.kk-foreground textarea')?.focus();break;case'select':showSelection(node().kind==='akira'?'赛博朋克':node().id==='main'?'阿基拉':'新的概念');break;case'assistant':assistantOpen=!assistantOpen;renderAssistant();break;case'close-assistant':assistantOpen=false;renderAssistant();break;case'providers':showProviders();break;case'close-modal':$('#kk-modal').hidden=true;break;case'add-provider':providers.push({name:'自定义接口',model:'自定义模型',address:'https://your-provider.example/v1',mark:'C'});editProvider=providers.length-1;renderProviders();break;case'test-provider':$('#kk-settings-note').textContent='此原型未连接 API；正式版将在这里验证密钥与模型可用性。';break;case'save-provider':{const p=providers[editProvider];p.name=$('#kk-config-name').value||p.name;p.address=$('#kk-config-address').value;p.model=$('#kk-config-model').value||p.model;if($('#kk-config-default').checked)defaultProvider=editProvider;$('#kk-modal').hidden=true;render();announce('演示设置已保存。新会话将默认使用 '+providers[defaultProvider].name+'。');break}case'sidebar':$('.kk-sidebar').classList.toggle('kk-visible');break;case'copy':announce('复制入口示意：正式版会复制当前回答。');break;case'play':play();break;}
});
root.addEventListener('input',e=>{if(e.target.matches('textarea')){const f=e.target.closest('form');if(f.dataset.form==='assistant')session.assistantDraft=e.target.value;else node().draft=e.target.value}});
root.addEventListener('change',e=>{if(e.target.matches('.kk-model-picker')&&!session.locked){session.provider=Number(e.target.value);render();announce('本会话将使用 '+providers[session.provider].name+'；发送前仍可更改。')}if(e.target.id==='kk-web'){session.web=e.target.value;announce('联网设置已更新，将应用于后续消息。')}if(e.target.id==='kk-think'){session.think=e.target.value;announce('思考设置已更新，将应用于后续消息。')}});
function sendMessage(form){if(!form||!form.matches('[data-form]'))return;const value=form.querySelector('textarea').value.trim();if(!value)return;if(form.dataset.form==='assistant'){session.locked=true;session.assistant.push(value);session.assistantDraft='';render();return}if(!session.locked){session.locked=true;session.title=value.length>13?value.slice(0,13)+'…':value;node().question=value;node().title='主会话';node().kind=value.includes('日本')?'main':'custom'}else node().extra.push({text:value,quote:node().quote||null});node().quote=null;node().draft='';selectedTerm='';render(true);announce('消息已发送。此会话的 Provider 与模型已锁定。')}
root.addEventListener('submit',e=>{e.preventDefault();sendMessage(e.target)});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){hideSelection();assistantOpen=false;$('#kk-modal').hidden=true;renderAssistant();$('.kk-sidebar').classList.remove('kk-visible')}if(e.target.matches('textarea')&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage(e.target.closest('form'))}});
root.addEventListener('mouseup',e=>{if(e.target.closest('[data-answer]'))captureSelection()});
root.addEventListener('keyup',e=>{if(e.key==='Shift'||e.key.startsWith('Arrow'))captureSelection()});
root.addEventListener('pointerdown',e=>{if(e.target.closest('.kk-selection-actions'))e.preventDefault();else if(!e.target.closest('[data-answer]'))hideSelection()});
function applyDesign(){root.style.setProperty('--kk-radius',design.radius+'px');const blue=design.accent==='blue';root.style.setProperty('--kk-accent',blue?'light-dark(#3f638c,#9fbedf)':'light-dark(#356750,#a2cbb2)');root.style.setProperty('--kk-soft',blue?'light-dark(#e8eef6,#2b3d50)':'light-dark(#e8f0e7,#2e4235)');root.style.setProperty('--kk-button',blue?'light-dark(#3f638c,#9fbedf)':'light-dark(#356750,#a2cbb2)');render()}
scene('deep');showSelection('赛博朋克');
let lastTreeWidth=0;const treeObserver=new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(Math.abs(width-lastTreeWidth)>1){lastTreeWidth=width;drawTree()}});treeObserver.observe($('#kk-tree'));
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'accent',{label:'强调色',options:[{label:'森林绿',value:'forest'},{label:'雾蓝',value:'blue'}]});tweak.addSlider(design,'rotation',{label:'每层旋转角度',min:3,max:6,step:.5,unit:'°'});tweak.addSlider(design,'blur',{label:'底层模糊强度',min:.5,max:2.5,step:.1,unit:'px'});tweak.addSlider(design,'radius',{label:'卡片圆角',min:6,max:22,unit:'px'});}
})();
