# Nginx 反代示例（HTTP）。证书建议用 certbot 自动补全 ssl 段：
#   sudo certbot --nginx -d know.example.com
# 放到 /etc/nginx/conf.d/know-know.conf 后 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name know.example.com;

    # 附件上限 20MB，留一点余量
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 保留 Host：服务端据此判断同源请求，不需要额外配置来源白名单
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 流式回答与知识助手：必须关闭缓冲并放长超时，否则会被攒包或截断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
